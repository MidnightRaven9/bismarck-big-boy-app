name: Auto-Update Android Package

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:

jobs:
  package:
    if: github.repository == 'MidnightRaven9/bismarck-big-boy-app'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute app shell hash
        id: hash
        shell: bash
        run: |
          sha256sum index.html manifest.webmanifest sw.js | awk '{printf "%s", $1}' > /tmp/shell-hash.txt
          echo "hash=$(cat /tmp/shell-hash.txt)" >> "$GITHUB_OUTPUT"

      - name: Get last packaged hash
        id: last
        shell: bash
        run: |
          LAST=$(git show main:APP_SHELL_HASH.txt 2>/dev/null || echo "NONE")
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Repackage if the app shell changed
        if: steps.hash.outputs.hash != steps.last.outputs.last
        id: package
        env:
          APP_URL: https://midnightraven9.github.io/bismarck-big-boy-app/
          PACKAGE_ID: com.bismarckbigboy.app
          APP_VERSION: 1.0.0.0
          RELEASE_TAG: v1.0.0
          APK_SUFFIX: v1.0.0
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/package-android.py

      - name: Store new hash and commit to main
        if: steps.hash.outputs.hash != steps.last.outputs.last
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp /tmp/shell-hash.txt APP_SHELL_HASH.txt
          git config user.name "Big Boy Auto-Packer"
          git config user.email "bot@bismarckbigboy.app"
          git add APP_SHELL_HASH.txt
          git commit -m "Auto-package: app shell hash $(cat APP_SHELL_HASH.txt)" 2>&1 || echo "no changes to commit"
          git push origin main

      - name: Check Facebook for new deals/specials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/bismarck-big-boy-app"
          # Install playwright locally for the scraper
          npm install --no-save --prefix /tmp/pw-node playwright 2>&1 | tail -1
          /tmp/pw-node/node_modules/.bin/playwright install chromium --with-deps 2>&1 | tail -2
          # Run the scraper (writes facebook_deals.json)
          NODE_PATH=/tmp/pw-node/node_modules node scripts/scrape_fb_deals.js 2>&1 | tail -2
          # Commit + push if the deals changed
          git pull --rebase origin main --autostash 2>&1 | tail -1 || true
          if git diff --quiet -- facebook_deals.json; then
            echo "Facebook deals: no change"
          else
            git commit -am "Update Facebook deals/specials (auto-packager cron)" 2>&1 | tail -1
            git push origin main 2>&1 | tail -2
          fi
