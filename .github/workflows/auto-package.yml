name: Auto-Update Android Package

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:

# Least privilege by default; only jobs that commit get write access.
permissions:
  contents: read

jobs:
  # No secrets, no writes: a failed check must stop packaging.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install pinned test dependencies
        run: npm ci

      - name: Install pinned browser
        run: npx playwright install --with-deps chromium

      - name: Syntax and data checks
        shell: bash
        run: |
          set -euo pipefail
          node --check core.js
          node --check app.js
          node --check sw.js
          node --check scripts/scrape_fb_deals.js
          node --check scripts/capture_screenshots.js
          python3 -m py_compile scripts/package-android.py
          node -e "const fs=require('fs');['manifest.webmanifest','menu.json','facebook_deals.json','hours_overrides.json','package.json','package-lock.json'].forEach(f=>JSON.parse(fs.readFileSync(f,'utf8')));console.log('JSON OK')"

      - name: Unit and browser tests
        run: |
          npm test
          npm run test:browser

  package:
    needs: validate
    if: github.repository == 'MidnightRaven9/bismarck-big-boy-app'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Compute app shell hash
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          # Every input shipped inside the TWA shell. facebook_deals.json is
          # refreshed independently by the scraper and does not change code.
          sha256sum index.html core.js app.js menu.json hours_overrides.json manifest.webmanifest sw.js icons/*.png | awk '{printf "%s", $1}' > /tmp/shell-hash.txt
          echo "hash=$(cat /tmp/shell-hash.txt)" >> "$GITHUB_OUTPUT"

      - name: Get last packaged hash
        id: last
        shell: bash
        run: |
          set -euo pipefail
          LAST=$(git show main:APP_SHELL_HASH.txt 2>/dev/null || echo "NONE")
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Repackage if the app shell changed
        if: steps.hash.outputs.hash != steps.last.outputs.last
        env:
          APP_URL: https://midnightraven9.github.io/bismarck-big-boy-app/
          PACKAGE_ID: com.bismarckbigboy.app
          APP_VERSION: 1.0.0.0
          RELEASE_TAG: v1.0.0
          APK_SUFFIX: v1.0.0
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/package-android.py

      - name: Store new hash and commit to main
        if: steps.hash.outputs.hash != steps.last.outputs.last
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/shell-hash.txt APP_SHELL_HASH.txt
          git config user.name "Big Boy Auto-Packer"
          git config user.email "bot@bismarckbigboy.app"
          git pull --rebase origin main --autostash
          git add APP_SHELL_HASH.txt
          if git diff --quiet --cached -- APP_SHELL_HASH.txt; then
            echo "Hash is already current on main"
          else
            git commit -m "Auto-package: app shell hash $(cat APP_SHELL_HASH.txt)"
            git push origin main
          fi

  # Data refresh needs write access but no signing secrets. It runs only after
  # packaging finishes so the two jobs never push to main concurrently.
  deals:
    needs: [validate, package]
    if: ${{ always() && needs.validate.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped') && github.repository == 'MidnightRaven9/bismarck-big-boy-app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Check Facebook for new deals/specials
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git pull --rebase origin main --autostash
          npm ci
          npx playwright install --with-deps chromium
          # Write to a temporary file first; only a validated result replaces
          # the committed data. A failed scrape leaves the last good file alone.
          DEALS_OUTPUT=/tmp/facebook_deals.new.json DEALS_PREVIOUS="$PWD/facebook_deals.json" node scripts/scrape_fb_deals.js
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/facebook_deals.new.json','utf8'));if(!Array.isArray(d))throw Error('deals payload is not an array');for(const x of d){if(!x||typeof x.title!=='string'||typeof x.text!=='string')throw Error('malformed deal');if(x.url&&!/^https:\/\/(www\.)?facebook\.com\//.test(x.url))throw Error('unsafe deal URL')}console.log('Validated',d.length,'deals')"
          mv /tmp/facebook_deals.new.json facebook_deals.json
          if git diff --quiet -- facebook_deals.json; then
            echo "Facebook deals: no change"
          else
            git add facebook_deals.json
            git commit -m "Update Facebook deals/specials (auto-packager cron)"
            git push origin main
          fi
